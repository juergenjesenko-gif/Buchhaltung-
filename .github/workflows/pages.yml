name: Website

# Veröffentlicht nur docs/site/ (Support, Datenschutz, Impressum,
# Nutzungsbedingungen) auf GitHub Pages. Manuell ausgelöst; Anleitung in
# docs/LAUNCH.md Abschnitt 1. Nie den ganzen Ordner docs/ veröffentlichen.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seiten aus docs/legal neu erzeugen
        run: python3 tool/site/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
