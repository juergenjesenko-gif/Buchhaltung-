name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # Ein laufender Build auf demselben Branch wird abgebrochen, wenn neu gepusht
  # wird – sonst stehen bei schneller Iteration fünf veraltete Builds in der Queue.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  analyse-und-test:
    name: Analyse & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Formatierung
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Statische Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test --reporter=expanded

  dokumentation:
    name: Dokumentation mitgeführt
    runs-on: ubuntu-latest
    # Nur bei Pull Requests: dort ist der Vergleichspunkt (Basis-Branch) klar.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Wer Verhalten ändert, muss die Spezifikation mitziehen. Der
      # specification_sync_test deckt nur die Kennzahlen ab; Anforderungen und
      # Bildschirme kann kein Test prüfen, deshalb dieser Abgleich.
      #
      # Ausnahmen: reines Refactoring oder Teständerungen. Dann "[skip-spec]"
      # in die Commit-Nachricht oder den PR-Titel schreiben.
      - name: Spezifikation gegen Codeänderungen prüfen
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)

          if ! echo "$CHANGED" | grep -q '^lib/'; then
            echo "Keine Änderung in lib/ – nichts zu prüfen."
            exit 0
          fi

          if git log "$BASE"..HEAD --pretty=%B | grep -qF '[skip-spec]'; then
            echo "[skip-spec] in einer Commit-Nachricht gefunden – übersprungen."
            exit 0
          fi

          if echo "$CHANGED" | grep -q '^docs/SPECIFICATION.md$'; then
            echo "Spezifikation wurde mitgeführt."
            exit 0
          fi

          echo "::error::lib/ wurde geändert, docs/SPECIFICATION.md nicht."
          echo ""
          echo "Geänderte Dateien in lib/:"
          echo "$CHANGED" | grep '^lib/' | sed 's/^/  /'
          echo ""
          echo "Bitte docs/SPECIFICATION.md anpassen (siehe CLAUDE.md für die"
          echo "Zuordnung Änderung -> Abschnitt) und die Änderungshistorie"
          echo "in Abschnitt 13 ergänzen."
          echo ""
          echo "Bei reinem Refactoring ohne Verhaltensänderung: [skip-spec]"
          echo "in die Commit-Nachricht schreiben."
          exit 1

  android-build:
    name: Android-Build
    runs-on: ubuntu-latest
    needs: analyse-und-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Release-Build, getrennt je CPU-Architektur.
      #
      # Warum Release und nicht Debug: ein Debug-APK ist rund 80 MB groß, bündelt
      # alle Architekturen und läuft deutlich langsamer – zum Ausprobieren der
      # Bedienung untauglich. Der Release-Build ist klein und schnell und läuft
      # zusätzlich durch R8/Minify, wo Release-Builds klassischerweise brechen.
      # Genau die Fehlerklasse, die `flutter analyze` nicht findet.
      #
      # Ohne android/key.properties signiert Gradle mit den Debug-Schlüsseln
      # (siehe android/app/build.gradle.kts). Das APK lässt sich damit auf einem
      # Telefon installieren, aber nicht bei Google Play einreichen – Absicht,
      # damit niemand versehentlich debug-signiert veröffentlicht.
      # Fester Testschlüssel aus den Repository-Secrets, damit sich jede neue
      # Test-APK als Update über die vorige installieren lässt. Fehlen die
      # Secrets, bleibt es beim wechselnden Debug-Schlüssel. Der Testschlüssel
      # ist NICHT der Upload-Schlüssel für Google Play (docs/RELEASE_PLAYBOOK.md).
      - name: Testschlüssel einrichten
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
        run: |
          if [ -z "$TEST_KEYSTORE_BASE64" ]; then
            echo "Keine Test-Secrets – Debug-Signatur wie bisher."
            exit 0
          fi
          echo "$TEST_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/test-signing.jks"
          {
            echo "storeFile=$RUNNER_TEMP/test-signing.jks"
            echo "storePassword=$TEST_KEYSTORE_PASSWORD"
            echo "keyPassword=$TEST_KEYSTORE_PASSWORD"
            echo "keyAlias=$TEST_KEY_ALIAS"
          } > android/key.properties
          echo "Signiert mit festem Testschlüssel."

      - name: Test-APK bauen
        # Nur arm64 (Pixel und praktisch jedes Telefon ab 2017); fortlaufende
        # Buildnummer = Laufnummer der CI. --split-per-abi bleibt Pflicht: es
        # setzt den versionCode auf 2000 + Buildnummer (arm64). Ohne Split wäre
        # er nur die Buildnummer, also kleiner als bei früheren Builds, und
        # Android verweigert das Update („App not installed“, Build 73).
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: APK benennen
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/JeNi-bucht-${version}-build-${{ github.run_number }}.apk"
          ls -lh out

      # Ungezippt (upload-artifact v7, archive: false): der Download ist direkt
      # die APK, Name = Dateiname.
      - uses: actions/upload-artifact@v7
        with:
          path: out/*.apk
          archive: false
          retention-days: 14
          if-no-files-found: error

  android-ocr-emulator:
    name: Belegerkennung im Emulator (R8)
    # Echte ML-Kit-Erkennung auf einem Android-Emulator im RELEASE-Build mit R8
    # (dort brach sie auf dem Pixel 10). integration_test läuft nicht im
    # Release-Modus; darum ein eigener Einstiegspunkt, Ergebnis über logcat.
    # Prüft: Text mit „Gesamt“ und „10,00“, Fehlercode bei fehlender Datei.
    runs-on: ubuntu-latest
    needs: analyse-und-test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - run: flutter pub get

      - name: Emulator starten und Erkennung prüfen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tool/ci/ocr_emulator_test.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ocr-belege
          path: test/fixtures/belege/ocr/*.json
          if-no-files-found: warn

  ios-build:
    name: iOS-Build
    runs-on: macos-latest
    needs: analyse-und-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # --no-codesign: ohne Apple-Zertifikate im Runner. Der Build prüft, dass
      # CocoaPods, die Plugin-Podspecs und der Xcode-Teil sauber durchlaufen.
      - name: iOS bauen
        run: flutter build ios --debug --no-codesign
