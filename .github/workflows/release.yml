name: Release

# Manuell ausgelöst. Ein automatischer Store-Upload bei jedem Merge auf main ist
# bei einer Buchhaltungsapp keine gute Idee – ein fehlerhafter Rechnungsexport in
# der Produktion kostet den Nutzer echtes Geld.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google-Play-Track"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      version:
        description: "Versionsname, z. B. 0.2.0 (leer = aus pubspec.yaml)"
        required: false
        type: string

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  android:
    name: Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Upload-Keystore aus Secrets rekonstruieren. Anlegen einmalig lokal:
      #   keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA \
      #     -keysize 2048 -validity 10000 -alias upload
      #   base64 -w0 upload-keystore.jks   -> Secret ANDROID_KEYSTORE_BASE64
      - name: Keystore einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      # Die Buildnummer muss bei jedem Upload steigen und darf nie
      # zurückgehen. github.run_number ist monoton und übersteht Reruns.
      - name: App Bundle bauen
        run: |
          ARGS="--release --build-number=${{ github.run_number }}"
          if [ -n "${{ inputs.version }}" ]; then
            ARGS="$ARGS --build-name=${{ inputs.version }}"
          fi
          flutter build appbundle $ARGS

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Der eigentliche Store-Upload ist bewusst noch nicht aktiv. Er braucht
      # einen Play-Service-Account und eine bereits manuell veröffentlichte
      # erste Version – Google Play akzeptiert den ersten Upload nicht über die API.
      # Nach dem ersten manuellen Release hier einkommentieren:
      #
      # - uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: at.jesenko.buchhaltung
      #     releaseFiles: build/app/outputs/bundle/release/app-release.aab
      #     track: ${{ inputs.track }}
      #     status: completed

  ios:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Signierung über einen temporären Keychain. Die Zertifikate stammen aus
      # Secrets; alternativ fastlane match, wenn mehrere Entwickler dazukommen.
      - name: Signierung einrichten
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain

          echo "$CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: IPA bauen
        run: |
          ARGS="--release --build-number=${{ github.run_number }}"
          if [ -n "${{ inputs.version }}" ]; then
            ARGS="$ARGS --build-name=${{ inputs.version }}"
          fi
          flutter build ipa $ARGS --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # Upload zu TestFlight. Braucht einen App-Store-Connect-API-Key.
      # Nach Einrichtung einkommentieren:
      #
      # - name: Zu TestFlight hochladen
      #   env:
      #     APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      #     APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      #     APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      #   run: |
      #     mkdir -p ~/private_keys
      #     echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 -d \
      #       > ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
      #     xcrun altool --upload-app -t ios -f build/ios/ipa/*.ipa \
      #       --apiKey "$APP_STORE_CONNECT_KEY_ID" \
      #       --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
