name: Release

# Manuell ausgelöst. Ein automatischer Store-Upload bei jedem Merge auf main ist
# bei einer Buchhaltungsapp keine gute Idee – ein fehlerhafter Rechnungsexport in
# der Produktion kostet den Nutzer echtes Geld.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google-Play-Track"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      version:
        description: "Versionsname, z. B. 0.2.0 (leer = aus pubspec.yaml)"
        required: false
        type: string

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  android:
    name: Android App Bundle
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Upload-Keystore aus Secrets rekonstruieren. Anlegen einmalig lokal:
      #   keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA \
      #     -keysize 2048 -validity 10000 -alias upload
      #   base64 -w0 upload-keystore.jks   -> Secret ANDROID_KEYSTORE_BASE64
      - name: Keystore einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      # Die Buildnummer muss bei jedem Upload steigen und darf nie
      # zurückgehen. github.run_number ist monoton und übersteht Reruns.
      - name: App Bundle bauen
        run: |
          # Store-Build: Lizenzprüfung ein (Spezifikation FA-13.10).
          ARGS="--release --build-number=${{ github.run_number }} --dart-define=LICENSING=true"
          if [ -n "${{ inputs.version }}" ]; then
            ARGS="$ARGS --build-name=${{ inputs.version }}"
          fi
          flutter build appbundle $ARGS
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          [ -n "${{ inputs.version }}" ] && VERSION="${{ inputs.version }}"
          AAB="JeNi-bucht-$VERSION-build-${{ github.run_number }}.aab"
          cp build/app/outputs/bundle/release/app-release.aab "$AAB"
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      # Ungezippt (archive: false): ein Klick lädt direkt die .aab.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.AAB }}
          archive: false
          retention-days: 30

      # Upload in Google Play nur, wenn das Secret PLAY_SERVICE_ACCOUNT_JSON
      # existiert. Die allererste Version muss von Hand in der Play Console
      # hochgeladen werden; Google akzeptiert sie nicht über die API.
      - name: In Google Play hochladen
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: at.jenibarb.jenibucht
          releaseFiles: ${{ env.AAB }}
          track: ${{ inputs.track }}
          status: draft

  ios:
    name: iOS Archiv und IPA
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build-Argumente
        run: |
          # Store-Build: Lizenzprüfung ein (Spezifikation FA-13.10).
          ARGS="--release --build-number=${{ github.run_number }} --dart-define=LICENSING=true"
          if [ -n "${{ inputs.version }}" ]; then
            ARGS="$ARGS --build-name=${{ inputs.version }}"
          fi
          echo "BUILD_ARGS=$ARGS" >> "$GITHUB_ENV"
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "SIGNIEREN=1" >> "$GITHUB_ENV"
          else
            echo "::warning::App-Store-Connect-Secrets fehlen: unsigniertes Archiv, keine IPA (docs/RELEASE_PLAYBOOK.md)."
            echo "SIGNIEREN=0" >> "$GITHUB_ENV"
          fi

      # Signierung ohne Zertifikat im Repository: Xcode-Cloud-Signierung über
      # einen App-Store-Connect-API-Schlüssel (Rolle Admin, damit Xcode
      # Verteilungszertifikat und Profil selbst anlegen darf).
      - name: Signiertes Archiv und IPA
        if: env.SIGNIEREN == '1'
        run: |
          KEY_PATH=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8
          echo "$ASC_KEY_BASE64" | base64 -d > "$KEY_PATH"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          # --no-codesign: Flutters eigene Zertifikatsprüfung überspringen; signiert
          # wird danach von xcodebuild mit dem API-Schlüssel (Cloud-Signierung).
          flutter build ios $BUILD_ARGS --config-only --no-codesign
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            $AUTH archive
          sed "s/DEIN_TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa $AUTH
          mv build/ios/ipa/*.ipa "JeNi-bucht-build-${{ github.run_number }}.ipa"
          rm -f "$KEY_PATH"

      - name: Unsigniertes Archiv
        if: env.SIGNIEREN != '1'
        run: |
          flutter build ios $BUILD_ARGS --no-codesign
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "JeNi-bucht-build-${{ github.run_number }}-unsigniert.zip" Payload

      - uses: actions/upload-artifact@v7
        if: env.SIGNIEREN == '1'
        with:
          path: JeNi-bucht-build-${{ github.run_number }}.ipa
          archive: false
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: env.SIGNIEREN != '1'
        with:
          path: JeNi-bucht-build-${{ github.run_number }}-unsigniert.zip
          archive: false
          retention-days: 7

      # Upload zu TestFlight mit demselben API-Schlüssel.
      - name: Zu TestFlight hochladen
        if: env.SIGNIEREN == '1'
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_BASE64" | base64 -d > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios -f JeNi-bucht-build-${{ github.run_number }}.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/private_keys/AuthKey_$ASC_KEY_ID.p8
