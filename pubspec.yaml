name: buchhaltung
description: "Buchhaltung für Einzelunternehmen und Kleinunternehmer in Österreich und Deutschland."
publish_to: "none"

# version: <Store-Versionsname>+<Buildnummer>
# Die Buildnummer wird in CI aus der Run-Nummer gesetzt, siehe docs/RELEASE_PLAYBOOK.md
version: 0.39.5+61

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Lokale Datenbank. Offline-first: die Buchhaltungsdaten verlassen das Gerät
  # nur, wenn der Nutzer aktiv exportiert oder teilt.
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Belegfotos
  image_picker: ^1.1.2
  # Nachbearbeitung gescannter Seiten (FA-2.51), reines Dart, MIT; kommt
  # ohnehin schon über pdf mit – keine neue Abhängigkeit im Build.
  image: ^4.3.0

  # Rechnungs-PDF
  pdf: ^3.11.0

  # Export/Teilen von PDF und CSV
  share_plus: ^10.0.0

  # Datums- und Zahlenformatierung de_AT / de_DE
  intl: any

  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
  archive: ^4.4.0
  flutter_secure_storage: ^10.3.4
  local_auth: ^3.0.2
  # E-Rechnungen (XRechnung, ZUGFeRD, ebInterface), reines Dart, MIT.
  xml: ^7.1.0
  # Kopplungs-QR für Mithelfer-Geräte (FA-17.1), reines Dart, BSD-3; kommt
  # ohnehin über pdf → barcode mit – keine neue Abhängigkeit im Build.
  qr: ^3.0.2
  # Abo über Google Play Billing und StoreKit (L-22.2). Kein Server, kein
  # Drittanbieter-SDK (L-22.10); der Android-Teil nur für den Abowechsel.
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.4
  # Nur für das Einlöseblatt der Angebotscodes auf iOS (Promo-Code, FA-13.13).
  in_app_purchase_storekit: ^0.4.13
  # Mailweg der Mithelfer (FA-17.12): Hintergrundabruf/-versand über Android
  # WorkManager bzw. iOS BGTaskScheduler (Flutter Community, MIT, gepflegt).
  # IMAP/SMTP selbst in reinem Dart (lib/services/mail/): enough_mail 2.1.7
  # verlangt xml < 7 und kollidiert mit xml ^7.1 oben.
  workmanager: ^0.10.10
  # Erinnerung „Belege senden“ beim Mithelfer ohne Postfach (FA-17.10), BSD-3.
  flutter_local_notifications: ^22.3.2
  # PDF-Betrachter und Systemdruckdialog (FA-5.48), DavBfr wie `pdf`,
  # Apache-2.0; rendert mit Plattformmitteln, offline, ohne PDFium-Binärdatei.
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  # Hilfe Stufe 1 (FA-11.1): das Handbuch selbst ist die Hilfe-Quelle,
  # keine Kopie. test/help_test.dart prüft die Einbindung.
  assets:
    - docs/BENUTZERHANDBUCH.md
    # Rechtliches (L-17.3): eine Quelle, test/legal_documents_test.dart
    - docs/legal/IMPRESSUM.md
    - docs/legal/DATENSCHUTZ.md
    - docs/legal/NUTZUNGSBEDINGUNGEN.md
    # PDF-Schrift Work Sans, SIL OFL 1.1 (P-R18), Lizenz in OFL.txt
    - assets/fonts/WorkSans-Regular.ttf
    - assets/fonts/WorkSans-Bold.ttf
    - assets/fonts/OFL.txt
    # Hauptlogo der Willkommensseite (FA-1.13), hell und dunkel, 1x/2x/3x
    # (2.0x/3.0x werden automatisch gefunden), DESIGN_SPEC 10a.
    - assets/brand/logo.png
    - assets/brand/logo_dark.png
    # Farbprofil sRGB IEC61966-2.1 (ICC, frei weitergebbar) für die
    # PDF/A-3 der ZUGFeRD-Rechnung (FA-5.49, P-R64).
    - assets/icc/sRGB2014.icc
